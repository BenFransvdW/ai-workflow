[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shorts"
version = "0.1.0"
description = "Automated, human-approved YouTube Shorts pipeline for Reddit stories (Raspberry Pi friendly)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6",
    "python-dotenv>=1",
    "pydantic>=2.5",
    "numpy>=1.26",
    "pillow>=10",
    "requests>=2.31",
    "praw>=7.7",
    "anthropic>=0.40",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0"]
piper = ["piper-tts>=1.2"]
telegram = ["python-telegram-bot[job-queue]>=21"]
youtube = ["google-api-python-client>=2.100", "google-auth-oauthlib>=1.2"]
dev = ["pytest>=8"]
all = ["shorts[whisper,piper,telegram,youtube]"]

[project.scripts]
shorts = "shorts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shorts = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: renders real video with ffmpeg"]
